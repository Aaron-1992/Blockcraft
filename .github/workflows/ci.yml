name: CI

# Builds the game with a real JDK (javac), runs the headless tests and keeps the update pack as a build artifact.
on:
  push:
    branches: ["arena/**"]
    paths-ignore: ["docs/**", "**.md", "ci-results/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build (javac) and make the update pack
        run: |
          python3 tools/build.py --patch
          echo "BC_VERSION=$(python3 -c 'import sys; sys.path.insert(0, "tools"); import build; print(build.game_version())')" >> "$GITHUB_ENV"

      - name: Verify packaged EXE/JAR and texture editing assets
        run: |
          python3 -m unittest discover -s tools -p test_verify_release.py
          VER=$(python3 -c 'import sys; sys.path.insert(0, "tools"); import build; print(build.game_version())')
          python3 tools/verify_release.py "releases/Blockcraft-UPDATE$VER-patch.zip" "$VER"

      - name: GLSL syntax check of every shader (no GPU needed)
        run: python3 tools/glsl_check.py

      - name: Headless tests (equivalence vs the 3.5 jar + unit tests)
        run: |
          set -o pipefail
          python3 tools/runtests.py 2>&1 | tee build/runtests.log

      - name: Reload and verify the actual distributed V6.10 sound worlds
        run: |
          python3 -m zipfile -e Blockcraft-Sound-Machines.zip build/distributed-sound-worlds
          javac -cp build/classes:libs/lwjgl-bundle.jar -d build/world-classes tools/worlds/BuildSoundWorlds.java
          java -Xmx2g -Djava.awt.headless=true -cp build/classes:build/world-classes:libs/lwjgl-bundle.jar bc.BuildSoundWorlds build/distributed-sound-worlds --verify

      - name: Native texture coverage (no silently inherited atlas cells)
        run: java -Djava.awt.headless=true -cp build/classes:build/test-classes:libs/lwjgl-bundle.jar bc.TextureAudit build/texture-coverage.tsv

      - name: Test output (readable through the check-run API)
        if: always()
        run: |
          python3 tools/ci_annotate.py build/runtests.log "test output" notice
          if [ -f build/equivalence-diff.txt ]; then python3 tools/ci_annotate.py build/equivalence-diff.txt "equivalence diff" error; fi

      - name: Keep the latest update pack (optional; Releases remain the delivery channel)
        continue-on-error: true # Storage quota must not turn passing tests into a failed build.
        uses: actions/upload-artifact@v4
        with:
          name: update-pack
          path: releases/Blockcraft-UPDATE${{ env.BC_VERSION }}-patch.zip
          retention-days: 3
          if-no-files-found: error
