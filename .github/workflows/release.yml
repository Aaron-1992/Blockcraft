name: Release

# Publishes the game on the repository's Releases page (github.com/<owner>/<repo>/releases):
# one click there downloads the complete game zip - no git, no pulling, and files may be up to 2 GB.
#
# Trigger: Actions tab -> Release -> Run workflow, or push a change to ci/release-trigger.txt
# (first line = version to publish, e.g. 3.6; empty = the newest update pack in releases/).
#
# It does not compile anything: it packages the update pack that is COMMITTED in releases/ (the very file the
# Windows smoke test ran) on top of the 3.5 base kit and verifies the result - see tools/make_release.py.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "version to publish, e.g. 3.6 (empty = newest update pack in releases/)"
        default: ""
  push:
    branches: ["arena/**"]
    paths: ["ci/release-trigger.txt"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Assemble the release files
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          VER="$INPUT_VERSION"
          if [ -z "$VER" ]; then VER="$(head -n1 ci/release-trigger.txt | tr -d '[:space:]')"; fi
          case "$VER" in *[!0-9.]*) VER="";; esac
          echo "version: '${VER:-newest}'"
          mkdir -p build
          python3 tools/make_release.py $VER 2>&1 | tee build/release.log

      - name: Publish on the Releases page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="$(cat build/release/VERSION)"
          TAG="v$VER"
          TITLE="Blockcraft V$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refusing to replace published release $TAG. Choose a new version."
            exit 1
          fi
          gh release create "$TAG" build/release/*.zip build/release/SHA256SUMS.txt --target "$GITHUB_SHA" --title "$TITLE" \
            --notes-file build/release/release-notes.md --latest
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[] | "\(.name)  \(.size) bytes")' | tee build/release-url.txt

      - name: Result (readable through the check-run API)
        if: always()
        run: |
          cat build/release.log build/release-url.txt > build/release-result.txt 2>/dev/null || true
          python3 tools/ci_annotate.py build/release-result.txt "release result" notice
