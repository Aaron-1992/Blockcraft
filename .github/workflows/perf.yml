name: Perf

# Runs the game's built-in benchmark (-Dbc.bench, tools/perf.py) headless with Mesa's software OpenGL and commits the numbers to
# ci-results/perf/. A software renderer is no graphics card: the numbers show WHERE a frame's time goes and what a change saves (vertices,
# draw calls, passes), not the frame rate of a real machine.
# Trigger: Actions tab -> Perf -> Run workflow, or push a change to ci/perf-trigger.txt.
on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths: ["ci/perf-trigger.txt"]

permissions:
  contents: write

concurrency:
  group: perf
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install headless OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libglu1-mesa mesa-utils \
            libxcursor1 libxrandr2 libxinerama1 libxi6 libxxf86vm1 libxrender1 imagemagick

      - name: Build the game
        run: python3 tools/build.py

      - name: Benchmark
        continue-on-error: true
        run: |
          set -o pipefail
          # line 1 of ci/perf-trigger.txt = scenario names (forest, mountain, classic) or 'all'; line 2 = window size, line 3 = frames per setting
          SCENES="$(sed -n 1p ci/perf-trigger.txt | tr -d '[:space:]')"
          WIN="$(sed -n 2p ci/perf-trigger.txt | tr -d '[:space:]')"
          FRAMES="$(sed -n 3p ci/perf-trigger.txt | tr -d '[:space:]')"
          case "$SCENES" in ''|*[!a-z,]*) SCENES=all;; esac   # (a line 1 of 'none' skips the benchmark)
          case "$WIN" in ''|*[!0-9x]*) WIN=640x360;; esac
          case "$FRAMES" in ''|*[!0-9]*) FRAMES=60;; esac
          echo "scenes: $SCENES window: $WIN frames: $FRAMES"
          mkdir -p ci-results/perf
          if [ "$SCENES" != none ]; then timeout 40m python3 tools/perf.py --scenes "$SCENES" --win "$WIN" --frames "$FRAMES" 2>&1 | tee build/perf.log; fi

      - name: Culling check (the same scenes with and without the culling of hidden sections must look the same)
        continue-on-error: true
        run: |
          set -o pipefail
          # line 4 of ci/perf-trigger.txt = scenes for the check (surface, hill, forest, cave1, cave2, cave3), 'all' or 'none'
          CHECK="$(sed -n 4p ci/perf-trigger.txt | tr -d '[:space:]')"
          case "$CHECK" in ''|*[!a-z0-9,-]*) CHECK=none;; esac
          if [ "$CHECK" != none ]; then timeout 30m python3 tools/cullcheck.py --scenes "$CHECK" 2>&1 | tee build/cullcheck.log; fi

      - name: Output (readable through the check-run API)
        if: always()
        run: |
          python3 tools/ci_annotate.py ci-results/perf/summary.md "perf summary" notice || true
          python3 tools/ci_annotate.py ci-results/perf/cullcheck.md "culling check" notice || true

      - name: Upload benchmark and culling diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: perf-diagnostics-${{ github.run_id }}
          path: |
            build/perf.log
            build/cullcheck.log
            ci-results/perf/summary.md
            ci-results/perf/cullcheck.md
            ci-results/perf/cull/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit results to the branch
        if: always()
        continue-on-error: true
        run: |
          git config user.name "blockcraft-ci"
          git config user.email "blockcraft-ci@users.noreply.github.com"
          git add -f ci-results/perf
          git commit -m "CI: perf results for ${GITHUB_SHA::7}" || { echo "nothing to commit"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
