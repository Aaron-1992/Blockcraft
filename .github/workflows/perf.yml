name: Perf

# Builds and benchmarks the V6.16 release, pre-packed V6.17 renderer, and packed-VBO candidate under Mesa llvmpipe; then runs
# the culling regression and packed-layout visual A/B checks. Reports land in ci-results/perf/. Software-renderer timings are not
# predictions of a graphics card's FPS; they show same-runner differences and renderer work counts.
# Trigger: Actions tab -> Perf -> Run workflow, or push a change to ci/perf-trigger.txt.
on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths: ["ci/perf-trigger.txt"]

permissions:
  contents: write

concurrency:
  group: perf
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install headless OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libglu1-mesa mesa-utils \
            libxcursor1 libxrandr2 libxinerama1 libxi6 libxxf86vm1 libxrender1 imagemagick

      - name: Build the game
        run: python3 tools/build.py

      - name: Prepare paired benchmark baselines
        run: |
          set -euo pipefail
          mkdir -p build/paired/v617-source build/paired
          # The pre-packed renderer is the parent of the packed-layout work. Archive only build inputs, not releases/screenshots.
          git archive 43518ba src res libs launcher tools/build.py | tar -x -C build/paired/v617-source
          (cd build/paired/v617-source && python3 tools/build.py)
          cp build/paired/v617-source/build/blockcraft.jar build/paired/v617.jar
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("releases/Blockcraft-UPDATE6.16-patch.zip") as patch:
              jar = patch.read("Blockcraft/blockcraft.jar")
          with open("build/paired/v616.jar", "wb") as out:
              out.write(jar)
          print("Prepared V6.16 release jar and pre-packed V6.17 source build for paired measurement.")
          PY

      - name: Benchmark
        continue-on-error: true
        run: |
          set -o pipefail
          # line 1 of ci/perf-trigger.txt = scenario names (forest, mountain, classic) or 'all'; line 2 = window size, line 3 = frames per setting
          SCENES="$(sed -n 1p ci/perf-trigger.txt | tr -d '[:space:]')"
          WIN="$(sed -n 2p ci/perf-trigger.txt | tr -d '[:space:]')"
          FRAMES="$(sed -n 3p ci/perf-trigger.txt | tr -d '[:space:]')"
          case "$SCENES" in ''|*[!a-z,]*) SCENES=all;; esac   # (a line 1 of 'none' skips the benchmark)
          case "$WIN" in ''|*[!0-9x]*) WIN=640x360;; esac
          case "$FRAMES" in ''|*[!0-9]*) FRAMES=60;; esac
          echo "scenes: $SCENES window: $WIN frames: $FRAMES"
          mkdir -p ci-results/perf
          if [ "$SCENES" != none ]; then timeout 50m python3 tools/paired_perf.py --v616 build/paired/v616.jar --v617 build/paired/v617.jar --packed build/blockcraft.jar --scenes "$SCENES" --win "$WIN" --frames "$FRAMES" --timeout 900 2>&1 | tee build/perf.log; fi

      - name: Culling regression check
        continue-on-error: true
        run: |
          set -o pipefail
          WIN="$(sed -n 2p ci/perf-trigger.txt | tr -d '[:space:]')"
          case "$WIN" in ''|*[!0-9x]*) WIN=640x360;; esac
          # line 4 of ci/perf-trigger.txt = scenes to compare with CaveCull disabled, 'all', or 'none'
          CHECK="$(sed -n 4p ci/perf-trigger.txt | tr -d '[:space:]')"
          case "$CHECK" in ''|*[!a-z0-9,-]*) CHECK=none;; esac
          if [ "$CHECK" != none ]; then
            timeout 30m python3 tools/cullcheck.py --scenes "$CHECK" --win "$WIN" 2>&1 | tee build/cullcheck.log
            if [ -f ci-results/perf/cullcheck.md ]; then cp ci-results/perf/cullcheck.md ci-results/perf/cullcheck-candidate.md; fi
            if [ -d ci-results/perf/cull ]; then mkdir -p build/paired/cull-candidate; cp -a ci-results/perf/cull/. build/paired/cull-candidate/; fi
          fi

      - name: Pre-pack cave culling diagnostic
        continue-on-error: true
        run: |
          set -o pipefail
          WIN="$(sed -n 2p ci/perf-trigger.txt | tr -d '[:space:]')"
          case "$WIN" in ''|*[!0-9x]*) WIN=640x360;; esac
          # Cave1 was flagged on the packed jar; check the parent build to separate a pre-existing culling result from a new regression.
          timeout 15m python3 tools/cullcheck.py --jar build/paired/v617.jar --scenes cave1 --win "$WIN" 2>&1 | tee build/cullcheck-prepack.log
          if [ -f ci-results/perf/cullcheck.md ]; then cp ci-results/perf/cullcheck.md ci-results/perf/cullcheck-v617.md; fi

      - name: Packed VBO visual A/B (world only; hand and HUD excluded)
        continue-on-error: true
        run: |
          set -o pipefail
          WIN="$(sed -n 2p ci/perf-trigger.txt | tr -d '[:space:]')"
          case "$WIN" in ''|*[!0-9x]*) WIN=640x360;; esac
          # The pre-pack and packed jars use repeated forest and cave1 screenshots to check visual equivalence.
          timeout 25m python3 tools/packed_visual.py --reference build/paired/v617.jar --candidate build/blockcraft.jar --scenes forest,cave1 --win "$WIN" 2>&1 | tee build/packed-visual.log

      - name: Output (readable through the check-run API)
        if: always()
        run: |
          python3 tools/ci_annotate.py ci-results/perf/summary.md "paired perf comparison" notice || true
          python3 tools/ci_annotate.py ci-results/perf/cullcheck-candidate.md "packed candidate culling check" notice || true
          python3 tools/ci_annotate.py ci-results/perf/cullcheck-v617.md "pre-pack V6.17 culling diagnostic" notice || true
          python3 tools/ci_annotate.py ci-results/perf/packed-visual.md "packed VBO visual A/B" notice || true

      - name: Upload paired benchmark and visual diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: perf-diagnostics-${{ github.run_id }}
          path: |
            build/perf.log
            build/cullcheck.log
            build/cullcheck-prepack.log
            build/packed-visual.log
            ci-results/perf/summary.md
            ci-results/perf/cullcheck-candidate.md
            ci-results/perf/cullcheck-v617.md
            ci-results/perf/packed-visual.md
            ci-results/perf/cull/
            build/paired/cull-candidate/
            build/paired/visual/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit results to the branch
        if: always()
        continue-on-error: true
        run: |
          git config user.name "blockcraft-ci"
          git config user.email "blockcraft-ci@users.noreply.github.com"
          git add -f ci-results/perf
          git commit -m "CI: perf results for ${GITHUB_SHA::7}" || { echo "nothing to commit"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
