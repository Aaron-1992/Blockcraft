name: Visual

# Runs the real game headless (Xvfb + Mesa software OpenGL), takes screenshots of a set of scenes with the
# original Update 3.5 jar and the freshly built jar, and commits side-by-side images + a report to ci-results/.
# Trigger: Actions tab -> Visual -> Run workflow, or push a change to ci/visual-trigger.txt.
on:
  workflow_dispatch:
    inputs:
      scenes:
        description: "comma separated scene names, or 'all'"
        default: "all"
  push:
    branches: ["arena/**"]
    paths: ["ci/visual-trigger.txt"]

permissions:
  contents: write

# a newer run replaces an older one that is still going
concurrency:
  group: visual
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install headless OpenGL + ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libglu1-mesa mesa-utils \
            libxcursor1 libxrandr2 libxinerama1 libxi6 libxxf86vm1 libxrender1 imagemagick

      - name: Build the game
        run: python3 tools/build.py

      - name: Screenshots
        run: |
          set -o pipefail
          SCENES="${{ github.event.inputs.scenes }}"
          if [ -z "$SCENES" ]; then SCENES="$(head -n1 ci/visual-trigger.txt | tr -d '[:space:]')"; fi
          case "$SCENES" in ''|*[!a-z0-9,-]*|[0-9]*) SCENES=all;; esac
          echo "scenes: $SCENES"
          # line 2 of ci/visual-trigger.txt = "jar=build": test the freshly built jar instead of the newest committed update pack
          if sed -n 2p ci/visual-trigger.txt | grep -q '^jar=build'; then export BC_NEW_JAR=build; echo "using the freshly built jar"; fi
          timeout 33m python3 tools/shots.py --scenes "$SCENES" 2>&1 | tee build/shots.log

      - name: Output (readable through the check-run API)
        if: always()
        run: |
          python3 tools/ci_annotate.py build/shots.log "shots log" notice
          ls -la ci-results/shots ci-results/shots/logs 2>/dev/null | head -60 > build/shots-ls.txt || true
          python3 tools/ci_annotate.py build/shots-ls.txt "shots files" notice
          for log in ci-results/shots/logs/pixel-*.log; do
            [ ! -f "$log" ] || python3 tools/ci_annotate.py "$log" "$(basename "$log")" notice
          done

      - name: Commit results to the branch
        if: always() && !cancelled()
        run: |
          git config user.name "blockcraft-ci"
          git config user.email "blockcraft-ci@users.noreply.github.com"
          git add -f ci-results
          git commit -m "CI: visual results for ${GITHUB_SHA::7}" || { echo "nothing to commit"; exit 0; }
          # Other result jobs can advance this same branch while screenshots run.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
          done
          echo "Could not publish CI results after three synchronized attempts."
          exit 1
