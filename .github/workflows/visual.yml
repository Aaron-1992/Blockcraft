name: Visual

# Runs the real game headless (Xvfb + Mesa software OpenGL), takes screenshots of a set of scenes with the
# original Update 3.5 jar and the freshly built jar, and commits side-by-side images + a report to ci-results/.
# Trigger: Actions tab -> Visual -> Run workflow, or push a change to ci/visual-trigger.txt.
on:
  workflow_dispatch:
    inputs:
      scenes:
        description: "comma separated scene names, or 'all'"
        default: "all"
  push:
    branches: ["arena/**"]
    paths: ["ci/visual-trigger.txt"]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install headless OpenGL + ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libglu1-mesa mesa-utils \
            libxcursor1 libxrandr2 libxinerama1 libxi6 libxxf86vm1 libxrender1 imagemagick

      - name: Build the game
        run: python3 tools/build.py

      - name: Screenshots
        run: python3 tools/shots.py --scenes "${{ github.event.inputs.scenes || 'all' }}"

      - name: Commit results to the branch
        run: |
          git config user.name "blockcraft-ci"
          git config user.email "blockcraft-ci@users.noreply.github.com"
          git add -f ci-results
          git commit -m "CI: visual results for ${GITHUB_SHA::7}" || { echo "nothing to commit"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
